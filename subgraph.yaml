specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: starknet
    name: WBTC
    network: sepolia
    source:
      address: "0x..." # WBTC合约地址（需要替换为实际的Starknet Sepolia上的WBTC地址）
      abi: WBTC
      startBlock: 0 # 开始监听的区块号
    mapping:
      kind: starknet/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
        - Transfer
      abis:
        - name: WBTC
          file: ./abis/WBTC.json
      eventHandlers:
        - event: Transfer(indexed felt252,indexed felt252,u256)
          handler: handleTransfer
      file: ./src/mapping.ts


version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - ipfs
      - postgres-graph
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres-graph
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'starknet-sepolia:https://starknet-sepolia.g.alchemy.com/starknet/version/rpc/v0_10/${ALCHEMY_API_KEY}'
      GRAPH_LOG: info
    volumes:
      - ./data:/data

  ipfs:
    image: ipfs/go-ipfs:v0.10.0
    ports:
      - '5001:5001'
    volumes:
      - ./data/ipfs:/data/ipfs

  # Graph Node 专用的 PostgreSQL 数据库
  postgres-graph:
    image: postgres:17  # 指定版本以避免 18+ 的挂载点变更
    ports:
      - '5432:5432'
    command:
      - "postgres"
      - "-cshared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres-graph:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 独立的 PostgreSQL 数据库，用于存放自定义表
  # 注意：如果使用 PostgreSQL 18+，需要将挂载点改为 /var/lib/postgresql
  postgres-custom:
    image: postgres:17  # 指定版本以避免 18+ 的挂载点变更
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: custom_user
      POSTGRES_PASSWORD: custom_password
      POSTGRES_DB: custom_db
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres-custom:/var/lib/postgresql/data
      # 可选：挂载初始化 SQL 脚本
      - ./scripts/init-custom-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custom_user -d custom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

